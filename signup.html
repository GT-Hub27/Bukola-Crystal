<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f8f6f2"><title>A note from the atelier | Halima Crystal Atelier</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body data-page="signup"><header id="site-header"></header><main><section class="signup-page section-wrap"><div class="signup-art"><span>✧</span><p>A little<br><em>note from<br>the atelier.</em></p></div><form class="paper-form signup-form" id="signup-form"><p class="eyebrow">A LITTLE LOVE, NOW AND THEN</p><h1>Stay close<br><em>to the sparkle.</em></h1><p>Be the first to hear about new designs, studio moments and the pieces we can’t wait to show you.</p><label>Your name<input name="name" autocomplete="name" required placeholder="First and last name"></label><label>Email address<input name="email" type="email" autocomplete="email" required placeholder="you@example.com"></label><label>Phone or WhatsApp <span>(optional)</span><input name="phone" type="tel" autocomplete="tel" placeholder="+234 …"></label><label class="consent-row"><input type="checkbox" name="consent" required><span>I’d like to receive occasional atelier updates by email.</span></label><button class="button" type="submit">Sign me up <span>↗</span></button><p class="form-message" aria-live="polite"></p><small>Just the lovely things. You can ask us to remove your details at any time.</small></form></section></main><footer id="site-footer"></footer><div id="modal-root"></div><script src="config.js"></script><script src="app.js"></script></body></html>
